<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speed Editor Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Speed Editor <span>Studio</span></div>
    <div class="profile-path" id="profilePath"></div>
    <div class="spacer"></div>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">Not connected</span></div>
    <div class="battery" id="battery" hidden></div>
    <label class="switch" title="Connect: take over the Speed Editor">
      <input type="checkbox" id="connectToggle"><span class="track"></span><span>Connect</span>
    </label>
    <label class="switch" title="Mappings active: when off, key presses only light up here, so you can test without triggering anything">
      <input type="checkbox" id="activeToggle"><span class="track"></span><span>Active</span>
    </label>
    <div class="toolbar">
      <button id="importBtn" class="ghost icon-btn" data-icon="import" title="Import a profile file, e.g. from another computer" aria-label="Import"></button>
      <button id="exportBtn" class="ghost icon-btn" data-icon="export" title="Export this profile to a file you can take to another computer" aria-label="Export"></button>
      <button id="revertBtn" class="ghost icon-btn" data-icon="revert" title="Revert: undo all unsaved changes" aria-label="Revert" disabled></button>
      <details class="menu" id="settingsMenu">
        <summary class="icon-btn ghost" data-icon="gear" title="Settings" aria-label="Settings"></summary>
        <div class="menu-body">
          <label class="switch" title="On: when DaVinci Resolve starts, the app lets go and Resolve gets the Speed Editor with its own native controls (your bindings pause until Resolve quits). Off: the app keeps the Speed Editor, so your bindings work inside Resolve; start this app before Resolve.">
            <input type="checkbox" id="yieldToggle"><span class="track"></span><span>Give to Resolve</span>
          </label>
          <label class="switch" title="Starts the app hidden in the tray when you sign in, so it holds the Speed Editor before DaVinci Resolve starts. Closing the window keeps the app running in the tray; quit it from the tray icon.">
            <input type="checkbox" id="autostartToggle"><span class="track"></span><span>Start with Windows</span>
          </label>
        </div>
      </details>
    </div>
    <button id="saveBtn" class="primary" data-icon="save" disabled><span id="saveLabel">Save</span></button>
  </header>

  <nav class="pages" id="pageTabs"></nav>

  <main class="workspace">
    <section class="device-area">
      <div class="list-view" id="listView" hidden></div>
      <div class="device" id="device">
        <div class="block left" id="blockLeft"></div>
        <div class="block middle" id="blockMiddle"></div>
        <div class="block right" id="blockRight">
          <div class="wheel-wrap"><button class="wheel" id="wheel"><span class="wheel-spin" id="wheelSpin"><span class="wheel-dot"></span></span><span class="wheel-label" id="wheelLabel"></span></button></div>
        </div>
      </div>
      <p class="hint" id="hint"></p>
    </section>

    <aside class="inspector" id="inspector"></aside>
  </main>

  <section class="palette">
    <div class="palette-head">
      <h2 title="Drag onto a key, or select a key and click">Actions</h2>
      <div class="palette-groups" id="paletteGroups"></div>
      <input id="paletteSearch" type="search" placeholder="Search actions…">
      <div class="assign-to" id="assignTo"></div>

    </div>
    <div class="palette-items" id="paletteItems"></div>
  </section>

  <footer class="log" id="log"></footer>

  <script src="icons.js"></script>
  <script src="layout.js"></script>
  <script src="app.js"></script>
</body>
</html>
