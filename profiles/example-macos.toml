# Open Speed Editor Mapper profile (macOS version of example.toml: Cmd instead of Ctrl, app names
# instead of .exe files, no F21-F24 because a Mac keyboard stops at F20)
#
# CUT, DIS and SMTH CUT select pages (on release). The mapper starts on the
# CUT page. The active page key blinks.
# Press CUT + SMTH CUT together to switch mappings off: all three keys flash
# briefly to confirm, then CUT, DIS and SMTH CUT act as normal transition keys
# (the selected one stays lit). Press them together again to come back to the
# CUT page.
#
# The CUT page keeps DaVinci's normal controls: only keys listed there change.
# Holding CUT (fn_key) switches the active page to its Fn layer
# ([pages.fn_keys]) for as long as it is held; a quick tap still selects the
# CUT page. DIS and SMTH CUT (modifier_keys) work the same way with their own
# layers ([pages.layers.dissolve], [pages.layers.smooth_cut]). In normal mode
# they are just the transition keys.
#
# Key names: see crates/speed-editor/src/keys.rs (e.g. cam1, stop_play, in).
# Actions:   { keys = "cmd+shift+m" }   held as long as the key is held
#            { run = "Calculator" }     opens an app (by name), file or URL
#            { text = "Hello" }         types text
#            { solo_track = 1 }         only video + audio track 1 take part in edits (0 = all)
#            { select_track = 1 }       selects the clip under the playhead on video track 1
# Extras:    label = "Scene 1"          name shown on the key in the editor
#            hold = { keys = "f14" }    long press (half a second) does this instead
# Wheel:     { scroll = {} } or { scroll = { horizontal = true } }
#            { keys = { left = "left", right = "right" } }

version = 1
page_keys = ["cut", "dissolve", "smooth_cut"]
toggle_chord = ["cut", "smooth_cut"]
fn_key = "cut"
modifier_keys = ["dissolve", "smooth_cut"]

# --- CUT: DaVinci's normal controls, plus an Fn layer ---------------------------
# Every key keeps its normal function. Hold CUT and press another key for the
# extra functions below. They click Resolve's own menu items, so they need no
# shortcut and work with any keyboard layout. Each page can
# have its own Fn layer.
[[pages]]
name = "DaVinci"
# Keys you don't map here keep their native Resolve function.
davinci_defaults = true
# Resolve's own wheel behaviour: JOG, SHTL and SCRL switch the mode, measured
# from the real Speed Editor in Resolve (docs/FINDINGS.md).
wheel = { davinci = {} }

[pages.fn_keys]
in = { resolve_menu = "Trim > Ripple > Start to Playhead", label = "Ripple start to playhead" }
out = { resolve_menu = "Trim > Ripple > End to Playhead", label = "Ripple end to playhead" }
trim_in = { resolve_menu = "Trim > Trim Start", label = "Trim start" }
trim_out = { resolve_menu = "Trim > Trim End", label = "Trim end" }
slip_source = { resolve_menu = "Timeline > Select Clips > Backward on All Tracks", label = "Select clips backward" }
slip_dest = { resolve_menu = "Timeline > Select Clips > Forward on All Tracks", label = "Select clips forward" }
# CUT + CAM n: only video track n + audio track n take part in the next edits
# (Resolve's Auto Track Selector); CUT + CAM 9: all tracks again.
# VIDEO ONLY or AUDIO ONLY pressed on their own (on DaVinci pages) light up and
# make CUT + CAM and DIS + CAM take only the video or only the audio; press the
# lit key again for both.
# CUT + wheel (built in on DaVinci pages): zooms the timeline in and out.
# CUT + CLOSE UP (built in): Trim tool on/off - TRIM IN/OUT ripple the timeline
# while CLOSE UP is lit, and leave a gap when it's dark (Selection tool).
# CUT + SHTL / SCRL (built in): one frame back / forward (like the arrow keys).
# DIS + SHTL / SCRL (built in): previous / next clip (like the up / down arrow keys).
# SMTH CUT + CAM 1-7 (built in on DaVinci pages): opens Resolve's Media, Cut, Edit,
# Fusion, Color, Fairlight and Deliver page, unless you map them yourself.
cam1 = { solo_track = 1, label = "Only track 1" }
cam2 = { solo_track = 2, label = "Only track 2" }
cam3 = { solo_track = 3, label = "Only track 3" }
cam4 = { solo_track = 4, label = "Only track 4" }
cam5 = { solo_track = 5, label = "Only track 5" }
cam6 = { solo_track = 6, label = "Only track 6" }
cam7 = { solo_track = 7, label = "Only track 7" }
cam8 = { solo_track = 8, label = "Only track 8" }
cam9 = { solo_track = 0, label = "All tracks" }

# DIS + CAM n: select the clip under the playhead on video track n, with its
# linked sound. Keyboard only (select at playhead, then track up/down), so no
# Resolve menu opens.
[pages.layers.dissolve]
cam1 = { select_track = 1, label = "Select clip on track 1" }
cam2 = { select_track = 2, label = "Select clip on track 2" }
cam3 = { select_track = 3, label = "Select clip on track 3" }
cam4 = { select_track = 4, label = "Select clip on track 4" }
cam5 = { select_track = 5, label = "Select clip on track 5" }
cam6 = { select_track = 6, label = "Select clip on track 6" }
cam7 = { select_track = 7, label = "Select clip on track 7" }
cam8 = { select_track = 8, label = "Select clip on track 8" }

# --- DIS: hotkeys for OBS and other apps (F13-F20 and Shift+F13-F16 clash with nothing) ---
[[pages]]
name = "Hotkeys"
wheel = { keys = { left = "left", right = "right" } }

[pages.keys]
cam1 = { keys = "f13" }
cam2 = { keys = "f14" }
cam3 = { keys = "f15" }
cam4 = { keys = "f16" }
cam5 = { keys = "f17" }
cam6 = { keys = "f18" }
cam7 = { keys = "f19" }
cam8 = { keys = "f20" }
cam9 = { keys = "shift+f13" }
live_overwrite = { keys = "shift+f14" }
video_only = { keys = "shift+f15" }
audio_only = { keys = "shift+f16" }
escape = { keys = "cmd+z", hold = { keys = "cmd+shift+z" } }
in = { keys = "cmd+c" }
out = { keys = "cmd+v" }
source = { keys = "cmd+tab" }

# --- SMTH CUT: media and macOS -----------------------------------------------
[[pages]]
name = "Media"
wheel = { keys = { left = "volume_down", right = "volume_up" } }

[pages.keys]
stop_play = { keys = "media_play_pause" }
in = { keys = "media_previous" }
out = { keys = "media_next" }
escape = { keys = "volume_mute" }
full_view = { keys = "ctrl+cmd+f" }
cam1 = { run = "Calculator" }
cam2 = { run = "TextEdit" }
